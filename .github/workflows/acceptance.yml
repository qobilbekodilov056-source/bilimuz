name: Record verified release evidence
on:
  workflow_dispatch:
    inputs:
      evidence_json:
        description: 'Completed acceptance evidence for this exact main commit. Reports/URLs only; no secrets or personal data.'
        required: true
        type: string
permissions:
  contents: read
jobs:
  record:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Read the operator's verified evidence
        env:
          EVIDENCE_JSON: ${{ inputs.evidence_json }}
        run: |
          node -e 'const fs=require("node:fs"); const value=JSON.parse(process.env.EVIDENCE_JSON); fs.mkdirSync("tmp/release",{recursive:true}); fs.writeFileSync("tmp/release/release-evidence.json",JSON.stringify(value));'
      - name: Check acceptance gates and exact commit
        env:
          RELEASE_EVIDENCE_FILE: tmp/release/release-evidence.json
        run: npm run check:release
      - uses: actions/upload-artifact@v7
        with:
          name: release-evidence
          path: tmp/release/release-evidence.json
          if-no-files-found: error
          retention-days: 1
