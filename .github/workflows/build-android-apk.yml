name: Build Bilim UZ Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'mobile/android/**'
      - '.github/workflows/build-android-apk.yml'

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build Android APK
        working-directory: mobile/android
        run: gradle assembleRelease --no-daemon

      - name: Prepare BilimUZ.apk
        run: cp mobile/android/app/build/outputs/apk/release/app-release.apk BilimUZ.apk

      - name: Upload BilimUZ.apk Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BilimUZ-Android-APK
          path: BilimUZ.apk
          retention-days: 90
