services:
  testlab:
    build: .
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      TESTLAB_ADMIN_EMAIL: ${TESTLAB_ADMIN_EMAIL:-admin@sysone.top}
      TESTLAB_ADMIN_PASSWORD: ${TESTLAB_ADMIN_PASSWORD:?Set a unique strong admin password in .env}
    volumes:
      - testlab_data:/usr/src/testlab/data
volumes:
  testlab_data:
